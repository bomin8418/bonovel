[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bo-novel"
version = "0.1.0"
description = "面向终端的功能完善的中文小说阅读器（纯标准库，零依赖）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "bo-novel" }]
keywords = ["tui", "reader", "novel", "terminal", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
bonovel = "bonovel.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["bonovel", "bonovel.ui"]
